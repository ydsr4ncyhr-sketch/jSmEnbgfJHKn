      --pre: oklch(0.65 0.16 145);
      --exc: oklch(0.65 0.18 25);

    html.system {

      --bg: oklch(0.97 0.0108 95.16);
      --lnk: oklch(0.56 0.2573 262.91);
      --mu: oklch(0.55 0.012 95);
      --bd: oklch(0.86 0.010 95);
      --pn: oklch(0.995 0.006 95);
      --p2: oklch(0.940 0.012 95);
      --cb: oklch(0.83 0.010 95);
      --pre: oklch(0.48 0.16 145);
      --exc: oklch(0.52 0.20 25);
    }

    @media (prefers-color-scheme:dark) {
      html.system {
        --t: oklch(0.88 0.0614 259.83);
        --bg: oklch(0.21 0.0353 259.49);
        --lnk: oklch(0.71 0.1643 254.62);
        --mu: oklch(0.58 0.040 259);
        --bd: oklch(0.28 0.030 259);
        --pn: oklch(0.24 0.030 259.49);

        --pre: oklch(0.65 0.16 145);
        --exc: oklch(0.65 0.18 25);

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      transition: background-color 500ms ease, color 500ms ease;
      scroll-behavior: smooth;
      scroll-padding: 2rem;
    }

    body,
    div,
    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    span,
    li,
    a,
    nav,
    main,
    header,
    aside,
    button,
    input {
      transition-property: background-color, color, border-color, opacity;
      transition-duration: 300ms;
    }

    body {
      font-family: 'Source Serif 4', 'Georgia', serif;
      background: var(--bg);
      color: var(--t);
      line-height: 1.681;
      margin: 0;
    }

    ::selection {
      background: oklch(from var(--lnk) l c h / 20%);
    }

    
    @keyframes unblur-in {
      0% {
        filter: blur(10px);
        transform: translateY(20%);
        opacity: 0;
      }

      100% {
        filter: blur(0px);
        transform: translateY(0%);
        opacity: 1;
      }
    }

    @keyframes fade-in {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    .unblur {
      filter: blur(10px);
      opacity: 0;
      animation: unblur-in 500ms cubic-bezier(.4, 0, .2, 1) forwards;
    }

    .fade {
      opacity: 0;
      animation: fade-in 500ms ease-in-out forwards;
    }

    .d0 {
      animation-delay: 0ms;
    }

    .d1 {
      animation-delay: 60ms;
    }

    .d2 {
      animation-delay: 120ms;
    }

    .d3 {
      animation-delay: 180ms;
    }

    .d4 {
      animation-delay: 240ms;
    }

    
    .fox-lnk {
      color: var(--lnk);
      text-decoration: none;
      position: relative;
      display: inline-block;
      overflow: visible;
    }

    .fox-lnk::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--lnk);
      opacity: .35;
      z-index: -1;
      transition: height 200ms ease, bottom 200ms ease, opacity 200ms ease;
    }

    .fox-lnk:hover::after {
      height: .5em;
      bottom: 3px;
      opacity: .22;
    }

    html.dark .fox-lnk:hover::after {
      opacity: .65;
    }

    @media(prefers-color-scheme:dark) {
      html.system .fox-lnk:hover::after {
        opacity: .65;
      }
    }

    .hdr {

      "Forgotten Gladius": { stats: { Length: 7.5, Penetration: 13, Scaling_WeaponMedium: 7, SwingSpeed: 0.73, Weight: 5, SwingSpeedMod: 0.14, Damage: 18 }, description: "Often found at the hip of officers on horseback during the Canticlysm, it sadly remained for many years only as a curio for petty nobles to fawn over in the early days after the Tides. Despite its moniker, it was brought back into the vogue by young naval officers of the Central Authority who saw combat value in the trinkets they'd inherited, dragging the blade out from obscurity.", sellRarity: "Rare", type: "Sword" },

      "Grand Railblade": { stats: { Scaling_WeaponHeavy: 13, Weight: 8, SwingSpeed: 0.82, Penetration: 25, Length: 11, Damage: 30 }, description: "A now legendary blade devised by the Ignition Union to exterminate the terrifying foes lurking deeper within the Depths. Said to constantly generate a warding heat that protects the wearer against the insidious chill of the Eternal Gale.", sellRarity: "Mythic", type: "Greatsword" },

      "Guiding Star": { stats: { Scaling_Mind: 3, Scaling_WeaponMedium: 10, SwingSpeed: 1, Length: 12, Weight: 5, Damage: 14 }, description: "A bow of sacred reverence for the Children of Navae, the Guiding Star is wielded during the Festival of Lights by aspirants who seek to prove themselves in its trials. During these trials, competitors must hunt a wolf blindfolded, using only their other senses to track and remain hidden. Should the wolf sink its fangs into the competitor, or leave any mark upon them, they are disqualified. The bow itself is also somewhat of a curiosity, as its arrows are conjured from the Ether of its wielder and guided by their own will. Many of the previous winners of the trials speak of the Guiding Star speaking to them in a soothing voice, pushing them in the right direction.", sellRarity: "", type: "Bow" },

      "Imperial Staff": { stats: { Scaling_Strength: 3, SwingSpeed: 0.76, Scaling_WeaponMedium: 5, Penetration: 10, Weight: 6, Length: 8, Damage: 19.5 }, description: "Legendary staff of a Legion Praetorian of ages past. In his hands its said to have wiped whole towns off the face of the map with one swing, and to have rapidly expanded the outer reaches of their territory. The veracity of these claims is of some dispute, but the peculiar properties of the weapon do lend some credence to its reputation.", sellRarity: "Mythic", type: "Spear" },
      "Infinity Blade": { spec: 1, stats: { Scaling_WeaponMedium: 5, SwingSpeed: 0.65, Penetration: 10, Length: 11, Weight: 13, Damage: 29 }, description: "A blade forged from pale metal recovered from Celestial crash-sites by Starkindred artisans. Nearly weightless, this type of blade is a staple in the West amongst adherents of the faith. Once one has spilt enough of their own blood in service of the Church, they are bestowed a weapon thrice-bathed in the sacred ichor of a Celestial.", sellRarity: "", type: "Greatsword" },

      "Kyrstear": { stats: { Scaling_Offhand: 0, EndLag: 0.1, Weight: 3, Length: 6.5, SwingSpeed: 1 }, description: "Your reliable offhand.", sellRarity: "", type: "Parry Dagger" },

      "Markor's Inheritor": { stats: { Scaling_WeaponHeavy: 7, EndLag: 0.1, SwingSpeed: 0.65, Weight: 8, Length: 8.5, Damage: 24 }, description: "The Scholars of Markor, said to catalog the world itself, travel from land to land collecting information by force of their blades. Mastering the styles of combat from various stretches of the sea, they practice their art through the blade itself.", sellRarity: "", type: "Greatsword" },

      "Night Axe": { stats: { Scaling_WeaponHeavy: 8, Penetration: 5, Chip: 80, SwingSpeed: 0.62, Length: 8.5, Weight: 10, Damage: 22 }, description: "The Night Axe, a weapon of little contemporary renown, was forged by the ancient folk of Minityrsa and wielded by Ekrim of the Rouhlx Dyad, who came to be known as the Third\u2019s Eclipse. Paired with its luminous counterpart, Daycleave, the Night Axe cast long shadows of fear across the old settlements. Its history is whispered in tales of unstoppable might and the haunting interplay of night and day. Shaky accounts speak of the pair meeting a grim fate at the hands of a power they once worshipped, sealing their legend in shade.", sellRarity: "", type: "Greataxe" },
      "Officer Saber": { stats: { Scaling_WeaponMedium: 4.5, SwingSpeed: 0.75, Length: 8, Weight: 6, Damage: 22 }, description: "The characteristic saber of an Authority Officer. Typically used in Authority raids on disputed territories.", sellRarity: "Common", type: "Sword" },
      "Old World Greatshield": { stats: { Scaling_Offhand: 0, Weight: 5 }, description: "A shield designed intricately, most likely from a pre-Canticlysm era. Its intricate design suggests previous use in royalty, although it cannot be said for sure.", sellRarity: "", type: "Shield" },
      "Pale Briar": { stats: { EndLag: 0, Chip: 10, Scaling_WeaponHeavy: 7.5, Weight: 7, Penetration: 25, Length: 10, SwingSpeed: 0.65, Damage: 23 }, description: "Staff of a Cardinal of the Starkindred Church, said to be coated in Celestial Ichor to grant it the investment of the Stars. This particular iteration fell into the hands of the Maestro during his training with the Legions in an excursion against the Starkindred Church.", sellRarity: "Mythic", type: "Greataxe" },
      "Pale Morning": { stats: { Scaling_WeaponHeavy: 9, Penetration: 20, EndLag: 0.1, SwingSpeed: 0.83, Weight: 10, Length: 9, Damage: 24 }, description: "A hammer of exceptionally fine make, a replica of a famous hammer wielded by a Canor warlord during the First Century of the New World.", sellRarity: "", type: "Greathammer" },
      "Parrying Dagger": { stats: { Scaling_Offhand: 0, EndLag: 0.1, Weight: 1, Length: 8, SwingSpeed: 1.05 }, description: "A dagger that is used more as a pivot for parrying than as a weapon of its own right.", sellRarity: "", type: "Parry Dagger" },
      "Pernach": { stats: { Scaling_WeaponMedium: 6, Chip: 5, Bleed: 0.2, Weight: 7, Penetration: 30, Length: 8, SwingSpeed: 0.74, Damage: 19 }, description: "", sellRarity: "", type: "Club" },
      "Petras Anchor": { stats: { Scaling_WeaponHeavy: 8, Penetration: 15, EndLag: 0.45, SwingSpeed: 0.65, Weight: 9, Length: 9, Damage: 26 }, description: "A anchor from a frigid beast, only those with true power wield it.", sellRarity: "", type: "Greathammer" },
      "Pleeksty's Inferno": { stats: { Scaling_WeaponMedium: 3, Chip: 10, Scaling_ElementFire: 4, Weight: 8, Penetration: 30, Length: 8, SwingSpeed: 0.7, Damage: 22 }, description: "In the Tiran homelands, weapons are often fashioned using knapped volcanic glass like obsidian. Though brittle, the prismatic blades embedded in the sides are sharper than any blade of metalwork. Following the ascent of Amorus Pleeksty and his pioneering of Flamecharm, many Tirans worked floral patterns into their Macuahuitls in reverence of the Deepwoken. Of these Macuahuitls, this particular specimen was a gift to Pleeksty himself, imbued with the eruptive and scorching heat of magma, and fit only to be wielded by those who truly walk in his footsteps.", sellRarity: "Mythic", type: "Club" },
      "Prestige Candy Cane": { spec: 1, stats: { Length: 9.5, SwingSpeed: 0.8, Scaling_WeaponLight: 7.5, Weight: 4, Damage: 18.5 }, description: "...", sellRarity: "", type: "Rapier" },
      "Purple Cloud": { stats: { Penetration: 15, Scaling_WeaponMedium: 9, SwingSpeed: 0.8, Weight: 5, Length: 7, Damage: 16.5 }, description: "The traditional martial arts style of the Justicars.", sellRarity: "", type: "Fist" },
      "Putrid Edenstaff": { halloween: 1, stats: { Scaling_WeaponHeavy: 8.5, Penetration: 15, EndLag: 0.1, SwingSpeed: 0.87, Weight: 9, Length: 9, Damage: 25 }, description: "", sellRarity: "Legendary", type: "Greathammer" },
      "Quartztone Pickaxe": { stats: { Scaling_WeaponHeavy: 7, SwingSpeed: 0.62, Penetration: 20, Length: 8, Weight: 7, Damage: 22 }, description: "A pickaxe fashioned from an exceptionally large node of quartz. The crystal has been painstakingly tuned to the frequency of a Mantra, conjuring its effects on use.", sellRarity: "Legendary", type: "Greataxe" },
      "Quickfang": { stats: { Length: 8, Penetration: 5, SwingSpeed: 0.81, Scaling_WeaponLight: 7, Weight: 4, Damage: 12 }, description: "A rapier passed down by your ancestors.", sellRarity: "", type: "Rapier" },
      "Railblade": { stats: { Scaling_WeaponHeavy: 8.3, Penetration: 25, SwingSpeed: 0.68, Length: 8.5, Weight: 8, Damage: 22 }, description: "A now legendary blade devised by the Ignition Union to exterminate the terrifying foes lurking deeper within the Depths. Said to constantly generate a warding heat that protects the wearer against the insidious chill of the Eternal Gale.", sellRarity: "Mythic", type: "Greatsword" },
      "Razor Cutlass": { stats: { Scaling_WeaponMedium: 8, Penetration: 25, Bleed: 0.6, SwingSpeed: 0.8, Length: 8, Weight: 7, Damage: 18 }, description: "A serrated cutlass fashioned after the famously brutal bite of a Lionfish.", sellRarity: "", type: "Sword" },
      "Relic Axe": { stats: { EndLag: 0.4, Chip: 10, Scaling_WeaponHeavy: 9, Weight: 6, Penetration: 25, Length: 8.5, SwingSpeed: 0.62, Damage: 25 }, description: "...", sellRarity: "", type: "Greataxe" },
      "Repeater": { stats: { Weight: 3, SwingSpeed: 0.6, Scaling_WeaponLight: 15, Length: 12, Damage: 14 }, description: "The mechanisms of this firearm are more of a meticulous make then their mass-produced cousins, and are often found as collector's items above the mastlepieces of the wealthy.", sellRarity: "", type: "Gun" },
      "Rifle Spear": { stats: { Scaling_WeaponMedium: 7, Reload: 0.65, Penetration: 25, SwingSpeed: 0.68, Weight: 5, Shots: 1, Length: 9, Damage: 21 }, description: "A modification upon Gunsmith Rosen's designs produced by Gunsmith Hierka, the former prot\u00e9g\u00e9 of Rosen. It's said that Hierka hid his origins as a member of the Authority's Bureau of Research in order to steal the Summer Company's secrets.", sellRarity: "", type: "Spear" },
      "Ritual Spear": { stats: { Penetration: 25, Scaling_WeaponMedium: 5, SwingSpeed: 0.68, Length: 9, Weight: 5, Damage: 19 }, description: "A spear used by a sacred tribe", sellRarity: "", type: "Spear" },
      "Rosen's Peacemaker": { stats: { SwingSpeed: 0.75, Scaling_WeaponMedium: 7.5, Weight: 3, Length: 7, Shots: 1, Damage: 18, Reload: 0.65 }, description: "A modification upon Gunsmith Rosen's designs produced by Gunsmith Hierka, the former prot\u00e9g\u00e9 of Rosen. It's said that Hierka hid his origins as a member of the Authority's Bureau of Research in order to steal the Summer Company's secrets.", sellRarity: "", type: "Rifle" },
      "Sacred Hammer": { stats: { Penetration: 10, Scaling_WeaponMedium: 7, SwingSpeed: 0.73, Length: 7, Weight: 5, Damage: 19.5 }, description: "...", sellRarity: "Rare", type: "Club" },
      "Scalesplitter": { stats: { Penetration: 10, Scaling_WeaponMedium: 5, SwingSpeed: 0.74, Length: 8, Weight: 5, Damage: 17.5 }, description: "An ancient Etrean twinblade, recently rediscovered as a fragment of driftland surfaced, revealing the remnants of a long-lost Etrean platoon that had perished and been claimed by the void ages ago. Now, this weapon, once thought lost to time, has re-emerged into circulation, carrying with it echoes of forgotten battles.", sellRarity: "", type: "Twinblade" },
      "Scimitar": { stats: { Scaling_WeaponMedium: 3, SwingSpeed: 0.715, Length: 8, Weight: 5, Damage: 15 }, description: "A curved blade that hails from the savannah of Markor. Though now assimilated into the Central Authority, the people of Markor still celebrate a rich culture.", sellRarity: "Common", type: "Sword" },
      "Serenflude Dagger": { spec: 1, stats: { Length: 7.5, SwingSpeed: 0.98, Scaling_WeaponLight: 5, Weight: 4, Damage: 17.5 }, description: "A dagger of slight proportions, yields power with the Sanguine, drenched in blood.", sellRarity: "Mythic", type: "Dagger" },
      "Serpent's Edge": { stats: { Penetration: 15, Scaling_WeaponMedium: 6, SwingSpeed: 0.75, Length: 8, Weight: 6, Damage: 22 }, description: "Despite popular opinion, the Serpent's Edge is actually a blade of Capra make, as opposed to one of Etrean make. It cuts just as well as any Etrean blade, however.", sellRarity: "", type: "Sword" },
      "Serrated Warspear": { stats: { Scaling_WeaponMedium: 6.5, Penetration: 20, Bleed: 0.5, SwingSpeed: 0.7, Length: 9, Weight: 5, Damage: 18 }, description: "...", sellRarity: "Legendary", type: "Spear" },
      "Shattered Katana": { stats: { Length: 8, Penetration: 30, Scaling_WeaponMedium: 7, SwingSpeed: 0.74, Weight: 5, SwingSpeedMod: 0.08, Damage: 20 }, description: "Fashioned after the legendary blade said to be wielded by the King of Etrea, the Splinterblade. An exceptionally lethal blade that makes short work of heavy armor.", sellRarity: "", type: "Sword" },
      "Shotel": { spec: 1, stats: { Scaling_WeaponMedium: 2.5, SwingSpeed: 0.71, Length: 7.2, Weight: 5, Damage: 23 }, description: "A blade of fine craft, likely an heirloom of whoever held the blade before it was pilfered from their remains.", sellRarity: "Common", type: "Sword" },
      "Skull Piercer": { halloween: 1, stats: { Length: 8.5, Penetration: 10, Bleed: 1.1, SwingSpeed: 0.81, Scaling_WeaponLight: 8, Weight: 4, Damage: 14 }, description: "Upon holding the blade, it feels as if the skulls adorning it are warm, somehow. What is this, truly?", sellRarity: "", type: "Rapier" },
      "Skyreap Blade": { halloween: 1, stats: { Scaling_WeaponHeavy: 8, EndLag: 0.1, SwingSpeed: 0.55, Weight: 7, Length: 9, Damage: 23 }, description: "A weapon from the lightborn's keep", sellRarity: "", type: "Greataxe" },
      "Soulsplitter": { spec: 1, stats: { Scaling_WeaponMedium: 700, Chip: 0.5, Penetration: 10, SwingSpeed: 0.75, SoulsplitCount: 0, Length: 10.5, Weight: 7, Damage: 20 }, description: "", sellRarity: "Legendary", type: "Spear" },
      "Sovereign's Punishment": { stats: { EndLag: 0.15, Chip: 10, Scaling_WeaponHeavy: 9, Weight: 13, Penetration: 20, Length: 9, SwingSpeed: 0.65, Damage: 26 }, description: "A ceremonial hammer meant to represent the strength of Authority Law. Considered unwieldy and unsuitable for battle. Until you picked it up.", sellRarity: "Legendary", type: "Greathammer" },
      "Spear of Longinus": { spec: 1, stats: { EndLag: 0.3, Chip: 75, Scaling_WeaponMedium: 7, Weight: 8, Penetration: 40, Length: 14, SwingSpeed: 0.67, Damage: 25 }, description: "An extraterrestrial artifact created by the First Ancestral Race with the power to penetrate any AT field and immobilize beings who possess god-like power.", sellRarity: "Legendary", type: "Spear" },
      "Speed Shattered Katana": { spec: 1, stats: { Length: 14, Penetration: 25, Scaling_WeaponMedium: 7, SwingSpeed: 0.75, Weight: 5, SwingSpeedMod: 0.08, Damage: 20 }, description: "Fashioned after the legendary blade said to be wielded by the King of Etrea, the Splinterblade. An exceptionally lethal blade that makes short work of heavy armor.", sellRarity: "", type: "Sword" },
      "spider test": { spec: 1, stats: { Weight: 1, SwingSpeed: 0.68, Scaling_WeaponLight: 12, Length: 10.5, Damage: 14 }, description: "With an almost flawless silver sheen that prevents corrosion from saltwater, the Dawnshot was purpose-built by Rosen for his lengthy travels at sea. Its short range is compensated for by the almost wrist-snapping kickback of four barrels. Although, with the Summer Company Cannon making most naval investments in their territories obsolete, this weapon has fallen out of production.", sellRarity: "", type: "Gun" },
      "Steel Maul": { stats: { Scaling_WeaponHeavy: 7, EndLag: 0.1, SwingSpeed: 0.65, Weight: 7, Length: 9, Damage: 22 }, description: "A sturdy maul perfect for knocking walls and people down alike.", sellRarity: "", type: "Greathammer" },
      "Stiletto": { stats: { Length: 6.5, EndLag: 0.05, SwingSpeed: 0.98, Scaling_WeaponLight: 3, Weight: 2, Damage: 11 }, description: "A remarkably thin blade often likened to (and used as) a toothpick.", sellRarity: "Common", type: "Dagger" },
      "Stoneheart": { spec: 1, stats: { Scaling_WeaponHeavy: 7, EndLag: 0.45, SwingSpeed: 0.6, Weight: 10, Length: 9, Damage: 22 }, description: "A hammer pieced together from the remains of one of Duke Ishamon Erisia's Golems. Conjured by the Duke's Resonance, they once patrolled his estate in Celtor before its fall. From the reports of spies hired by rival nobles in the city, he was only able to support a limited number of golems - his acquisition of the Forge of Sin seems to have extended his capacity by other, more sinister means.", sellRarity: "", type: "Greathammer" },
      "Stormseye": { stats: { EndLag: 0.08, Reload: 0.65, Scaling_ElementLightning: 6, Scaling_WeaponMedium: 3, Penetration: 25, SwingSpeed: 0.75, Weight: 5, Shots: 1, Length: 8, Damage: 19.5 }, description: "Pilfered from Union shipments, the Summer Company saw the tremendous energy stored within Kyrsan Medallions and fashioned this uniquely violent prototype. Rosen allegedly burst into raucous laughter when presented with the draft, immediately giving his approval.", sellRarity: "", type: "Rifle" },
      "Summer Rifle": { stats: { Weight: 4, Scaling_WeaponMedium: 6, SwingSpeed: 0.73, Length: 8, Shots: 1, Damage: 17, Reload: 0.65 }, description: "A standard issue firearm produced by the Summer Company. A reliable firearm, though somewhat less elegant than their more expensive models.", sellRarity: "", type: "Rifle" },
      "Sword": { stats: { Scaling_WeaponMedium: 2.5, SwingSpeed: 0.75, Length: 8, Weight: 5, Damage: 18 }, description: "A blade of fine craft, likely an heirloom of whoever held the blade before it was pilfered from their remains.", sellRarity: "Common", type: "Sword" },
      "Swordfish Rapier": { stats: { Length: 8, SwingSpeed: 0.8, Scaling_WeaponLight: 6.5, Weight: 4, Damage: 16.5 }, description: "Taste like fish.", sellRarity: "", type: "Rapier" },
      "Tanto": { stats: { SwingSpeed: 0.98, Weight: 3, Scaling_WeaponLight: 8, Length: 6.5, Damage: 15.5 }, description: "A dagger forged by a Etrean smith, the Tanto is said to bear the same durability as the Katana, but in a smaller profile.", sellRarity: "Mythic", type: "Dagger" },
      "Targe": { stats: { Scaling_Offhand: 0, Weight: 4 }, description: "A round, wooden shield often accompanied by spear or short blade.", sellRarity: "", type: "Shield" },
      "Test Skipper": { spec: 1, stats: { Weight: 3, Penetration: 20, SwingSpeed: 0.9, Scaling_WeaponLight: 9, Length: 7, Damage: 14.5 }, description: "The style of the drowned ones.", sellRarity: "", type: "Fist" },
      "Test Sword": { spec: 1, stats: { Scaling_WeaponMedium: 2.5, SwingSpeed: 0.75, Length: 8, Weight: 5, Damage: 18 }, description: "A blade of fine craft, likely an heirloom of whoever held the blade before it was pilfered from their remains.", sellRarity: "Common", type: "Sword" },
      "The Barrel": { spec: 1, stats: { Scaling_WeaponHeavy: 8.5, Weight: 9.5, Chip: 0.15, SwingSpeed: 0.82, Length: 8, Penetration: 5, Damage: 25.5 }, description: "Once mounted on a royal Etrean galleon, this bulky cannon was salvaged from a wreck by the Summer Company and adapted into a handheld design; still cumbersome, according to those who used it before its eventual retirement.", sellRarity: "", type: "Greatcannon" },
      "The Colremis Saber": { spec: 1, stats: { Chip: 5, Scaling_WeaponMedium: 6, SwingSpeed: 0.74, Length: 8, Weight: 7, Damage: 18 }, description: "Forged from fractured kyber and ancient alloy, Colremis hums with a deep, resonant tone \u2014 as if mourning forgotten wars. Its blade burns with a muted, smoky hue, pulsing like the last heartbeat of a fallen star. Said to awaken only in the hands of one who has faced true loss, Colremis is not merely a weapon, but a memory made manifest.", sellRarity: "", type: "Sword" },
      "The Flippers of Fate": { stats: { Scaling_WeaponLight: 1.5, Scaling_Intelligence: 3, Scaling_Charisma: 3, Weight: 3.5, Penetration: 15, Length: 6.5, SwingSpeed: 0.7, Damage: 14.5 }, description: "That isn't smoke. It's steam.", sellRarity: "", type: "Dagger" },
      "The Long Tong of The Law": { stats: { Chip: 40, Scaling_Charisma: 1.15, Scaling_Intelligence: 1.1, Bleed: 0.4, Weight: 8, Scaling_WeaponHeavy: 8.5, Length: 10, SwingSpeed: 0.55, Damage: 20 }, description: "Where's the crabbo SAUUUCE?", sellRarity: "", type: "Greatsword" },
      "The Moonblades": { spec: 1, stats: { EndLag: 0.05, Scaling_WeaponLight: 8, Scaling_Intelligence: 2, Weight: 4, Penetration: 30, Length: 6, SwingSpeed: 0.7, Damage: 13 }, description: "Legendary staff of a Legion Praetorian of ages past. In his hands its said to have wiped whole towns off the face of the map with one swing, and to have rapidly expanded the outer reaches of their territory. The veracity of these claims is of some dispute, but the peculiar properties of the weapon do lend some credence to its reputation.", sellRarity: "Mythic", type: "Dagger" },
      "The Pastry Paster": { stats: { Scaling_Charisma: 2, Scaling_Intelligence: 2, Scaling_WeaponMedium: 5, SwingSpeed: 0.75, Length: 7.5, Weight: 7, Damage: 15.5 }, description: "Anyone can cook, but only the fearless can be great.", sellRarity: "", type: "Club" },
      "The Path's Defender": { stats: { Scaling_Offhand: 0, Weight: 10 }, description: "A venerated shield, donned only by those who have walked their own Path as they see fit.", sellRarity: "", type: "Shield" },
      "Toothed Club": { stats: { Scaling_WeaponMedium: 5, Chip: 0.05, Bleed: 0.15, Weight: 6, Penetration: 10, Length: 7.5, SwingSpeed: 0.73, Damage: 16 }, description: "", sellRarity: "", type: "Club" },
      "Trident Spear": { stats: { Scaling_WeaponMedium: 6, Penetration: 25, EndLag: 0.6, SwingSpeed: 0.705, Length: 9, Weight: 5, Damage: 19 }, description: "A spear perfect for poking at a safe distance.", sellRarity: "", type: "Spear" },
      "True Chorus of Agonies": { spec: 1, stats: { Scaling_WeaponHeavy: 11, Chip: 50, SwingSpeed: 0.62, Length: 14.5, Weight: 15, Damage: 26 }, description: "Towering over the trial like a monument, Enmity's presence draws the very air from your lungs, oppressive and unyielding, as if it too was full of scorn. Now in your grasp, the vile axe pulses with a dreadful rhythm, a heartbeat woven from the anguish of innumerable tortured souls. The air thickens under its weight, every inch of the weapon's twisted form resenting its own existence. The damned enforcers within wail for release, their mournful song clawing at your spirit. Yet, stood firm, you meet the abyss with defiance. The Chorus of Agonies envelops you.", sellRarity: "", type: "Greataxe" },
      "True Crypt Blade": { spec: 1, stats: { Scaling_WeaponHeavy: 4, Scaling_ElementShadow: 9, SwingSpeed: 0.725, Weight: 9, Length: 12, Damage: 22 }, description: "A blade said to have been forged from the remains of the Last Dead, the last fortunate souls at the end of the Canticlysm to be spared the Drowning.", sellRarity: "Mythic", type: "Greatsword" },
      "True Guiding Star": { spec: 1, stats: { Scaling_Mind: 3, Scaling_WeaponMedium: 10, SwingSpeed: 1, Length: 15, Weight: 5, Damage: 14 }, description: "A bow of sacred reverence for the Children of Navae, the Guiding Star is wielded during the Festival of Lights by aspirants who seek to prove themselves in its trials. During these trials, competitors must hunt a wolf blindfolded, using only their other senses to track and remain hidden. Should the wolf sink its fangs into the competitor, or leave any mark upon them, they are disqualified. The bow itself is also somewhat of a curiosity, as its arrows are conjured from the Ether of its wielder and guided by their own will. Many of the previous winners of the trials speak of the Guiding Star speaking to them in a soothing voice, pushing them in the right direction.", sellRarity: "", type: "Bow" },
      "True Hero's Blade of Shadow": { spec: 1, stats: { Scaling_ElementShadow: 9, Penetration: 10, Weight: 5, SwingSpeed: 0.75, Length: 13, SwingSpeedMod: 0.08, Damage: 20 }, description: "A blade said to be enruned with a passage of the song, it evokes the merciless void of the darkest shadows.", sellRarity: "", type: "Sword" },
      "True Imperator's Edge": { spec: 1, stats: { Scaling_WeaponMedium: 2, Scaling_Fortitude: 4, Scaling_Strength: 3, Weight: 7, Penetration: 20, Length: 14, SwingSpeed: 0.75, Damage: 20 }, description: "A gargantuan greatspear, its tip infused with the very essence of light, shines like a beacon of unyielding strength and fortitude. Carried at the forefront of the Hundred Legions, it illuminates their path with a blinding brilliance, a symbol of resilience that pierces the shadows and leads them to inevitable victory.", sellRarity: "Mythic", type: "Spear" },
      "True Imperial Staff": { spec: 1, stats: { Scaling_Strength: 3, SwingSpeed: 0.7, Scaling_WeaponMedium: 5, Penetration: 40, Weight: 6, Length: 11, Damage: 19.5 }, description: "Legendary staff of a Legion Praetorian of ages past. In his hands its said to have wiped whole towns off the face of the map with one swing, and to have rapidly expanded the outer reaches of their territory. The veracity of these claims is of some dispute, but the peculiar properties of the weapon do lend some credence to its reputation.", sellRarity: "Mythic", type: "Spear" },
      "True Kindred Edict": { spec: 1, stats: { Scaling_Body: 2.5, Scaling_WeaponMedium: 5, SwingSpeed: 0.78, Penetration: 10, Length: 12, Weight: 4.5, Damage: 17 }, description: "A blade forged from pale metal recovered from Celestial crash-sites by Starkindred artisans. Nearly weightless, this type of blade is a staple in the West amongst adherents of the faith. Once one has spilt enough of their own blood in service of the Church, they are bestowed a weapon thrice-bathed in the sacred ichor of a Celestial.", sellRarity: "", type: "Sword" },
      "True Kyrswynter": { spec: 1, stats: { Scaling_WeaponMedium: 5, Chip: 0.05, Scaling_ElementIce: 3, Bleed: 1, Weight: 6, Penetration: 20, Length: 12, SwingSpeed: 0.72, Damage: 16 }, description: "Forged in an age lost to history and salvaged from the Eternal Gale, this relic hails from a forgotten era. As the last whispered remnant of its kind, it comes from a time before the people of New Kyrsa fell under the command of the Drowned God Ethiron. The spear is extremely cold to the touch, with an unsettling chill that clings to your skin, leaving a lingering numbness. It embodies the delicate and refined artistry of the Kyrsgarde, showcasing their elegance and sophistication prior to their corruption. Though the Kyrsgarde still wield spears of frost, the craftsmanship of their modern weaponry pales in comparison, having become crude and uninspired under Ethirons thrall.", sellRarity: "Mythic", type: "Spear" },
      "True Legion Kata": { spec: 1, stats: { Weight: 3, Penetration: 20, EndLag: 0.05, SwingSpeed: 0.88, Scaling_WeaponLight: 9, Length: 7, Damage: 14 }, description: "The traditional martial arts style of the Authority.", sellRarity: "", type: "Fist" },
      "True Repeater": { spec: 1, stats: { Weight: 3, SwingSpeed: 0.63, Scaling_WeaponLight: 15, Length: 15, Damage: 14 }, description: "The mechanisms of this firearm are more of a meticulous make then their mass-produced cousins, and are often found as collector's items above the mastlepieces of the wealthy.", sellRarity: "", type: "Gun" },
      "True Seraph Spear": { spec: 1, stats: { EndLag: 0.6, Chip: 40, Scaling_WeaponMedium: 7, Weight: 5, Penetration: 20, Length: 9, SwingSpeed: 0.72, Damage: 18.5 }, description: "...", sellRarity: "Legendary", type: "Spear" },
      "True Shattered Katana": { spec: 1, stats: { Length: 13, Penetration: 30, Scaling_WeaponMedium: 7, SwingSpeed: 0.74, Weight: 5, SwingSpeedMod: 0.08, Damage: 20 }, description: "Fashioned after the legendary blade said to be wielded by the King of Etrea, the Splinterblade. An exceptionally lethal blade that makes short work of heavy armor.", sellRarity: "", type: "Sword" },
      "True Warden Ceremonial Sword": { spec: 1, stats: { Scaling_WeaponMedium: 8.5, SwingSpeed: 0.8, EndLag: -0.2, Weight: 4, Length: 13, SwingSpeedMod: 0.195, Damage: 17 }, description: "", sellRarity: "Rare", type: "Sword" },
      "True Wretched Mawblades": {spec: 1,  stats: { Scaling_WeaponHeavy: 8, SwingSpeed: 0.615, Weight: 8, Length: 9, Damage: 27.5 }, description: "Born from a twisted experiment by the enigmatic lightborn smiths of the floating keep, the Mawblades are a testament to unspeakable treachery. Stripped of mortality and violently reshaped, the tortured souls within these blades endure a fate crueler than death, their teeth aching eternally as they are bound to the insatiable hunger for destruction.", sellRarity: "", type: "Greatsword" },
      "Tunafish Greathammer": { spec: 1, stats: { Scaling_WeaponHeavy: 7, EndLag: 0.45, SwingSpeed: 0.6, Weight: 10, Length: 9, Damage: 23.6 }, description: "Smells like fish.", sellRarity: "", type: "Greathammer" },
      "Umbrite Witherblade": { stats: { Scaling_WeaponMedium: 12, Bleed: 0.3, Chip: 0.2, Weight: 5, Length: 8, SwingSpeed: 0.74, Damage: 13 }, description: "Once a derelict frame, now restored by your offerings, pulsing quicker and quicker... Its fibers twist and crack, reaching out to consume the cutlass, its shape warping into a rough mirage of the weapon. Infused with minerals it once knew, channeling the warped umbrite through its slick inky veins. Each strike drains the very soul of your foes, leaving them withered and undone.", sellRarity: "", type: "Sword" },

      if (elementalKeys.length > 0) {
        return { tier: 'elemental', sub: 'elemental' };
      }
      
      const hasL = s.Scaling_WeaponLight !== undefined;
      const hasM = s.Scaling_WeaponMedium !== undefined;
      const hasH = s.Scaling_WeaponHeavy !== undefined;
      const wc = (hasL ? 1 : 0) + (hasM ? 1 : 0) + (hasH ? 1 : 0);

        Greataxe: 'heavy', Greatsword: 'heavy', Greathammer: 'heavy', Greatcannon: 'heavy'
      };
      let tier;
      if (wc >= 2) tier = 'hybrid';
      else if (hasL) tier = 'light';
      else if (hasM) tier = 'medium';
      else if (hasH) tier = 'heavy';
      else return null;

        Dagger: 'daggers', Fist: 'fists', Gun: 'pistols', Rapier: 'rapiers',

    function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function fmtR(r) {
      if (!r || r === "None") return `<em style="opacity:.4">—</em>`;
      return r.split(/(\[.*?\])/g).map(p => {
        const t = p.trim(); if (!t) return "";
        if (t.startsWith("[ PREREQUISIT")) return `<span class="rp">${esc(t)}</span>`;
        if (t.startsWith("[ MUTUAL EXCLUS")) return `<span class="rx">${esc(t)}</span>`;

      }).join(" ").trim();
    }

    
    function _norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, '').trim(); }
    function buildDepMap() {
      const normToKey = {};
      Object.keys(T).forEach(k => { normToKey[_norm(k)] = k; });
      const children = {};
      const excl = {};

      Object.entries(T).forEach(([name, t]) => {
        const r = t.r || '';
        const matches = Array.from(String(r).matchAll(/\[([^\]]*?)\]/g)).map(m => m[1]);
        matches.forEach(m => {

          const isReq = /PREREQUISIT/i.test(m);
          const isEx = /MUTUAL\s+EXCLUS/i.test(m);

          let content = m.replace(/PREREQUISIT(?:E|ES)\s*:?/i, '')
            .replace(/MUTUAL\s+EXCLUS(?:IVE|IVES)\s*:?/i, '')
            .trim();
          content.split(',').map(x => x.trim()).forEach(pr => {
            const norm = _norm(pr);
            const key = normToKey[norm];
            if (!key) return;
            if (isReq) {
              children[key] = children[key] || [];
              if (!children[key].includes(name)) children[key].push(name);
            }
            if (isEx) {
              excl[key] = excl[key] || [];
              if (!excl[key].includes(name)) excl[key].push(name);
            }
          });
        });
      });

      return { children, excl };
    }

    let DEP_MAP = null;
    function ensureDepMap() { if (!DEP_MAP) DEP_MAP = buildDepMap(); return DEP_MAP; }

    function _collectLines(name, dep, seen, prefix) {
      if (seen.has(name)) return [];
      const nextSeen = new Set(seen);
      nextSeen.add(name);
      const ch = (dep.children && dep.children[name]) || [];
      const ex = (dep.excl && dep.excl[name]) || [];
      const both = [];
      ch.forEach(c => both.push({ n: c, type: 'req' }));
      ex.forEach(c => both.push({ n: c, type: 'ex' }));
      if (!both.length) return [];
      let lines = [];
      both.forEach((item, idx) => {
        const isLast = idx === both.length - 1;
        const connector = item.type === 'ex'
          ? (isLast ? 'x└─' : 'x├─')
          : (isLast ? '└─' : '├─');
        const childContinue = prefix + (isLast ? '   ' : '│  ');
        lines.push({ prefix, connector, item });
        lines = lines.concat(_collectLines(item.n, dep, nextSeen, childContinue));
      });
      return lines;
    }

    function renderSubtreeHTML(name, dep, seen) {
      const lines = _collectLines(name, dep, seen || new Set(), '');
      if (!lines.length) return '';
      return lines.map(({ prefix, connector, item }) => {
        const isEx = item.type === 'ex';
        return `<div class="dep-row">` +
          `<span class="dep-prefix">${esc(prefix + connector)} </span>` +
          `<a href="#" class="dep-link${isEx ? ' rx' : ''}" data-name="${esc(item.n)}">${esc(item.n)}</a>` +
          `</div>`;
      }).join('');
    }

    function attachDependencyTrees() {
      const dep = ensureDepMap();
      document.querySelectorAll('.fi').forEach(fi => {
        if (fi.querySelector('.dep-children') || fi.querySelector('.dep-level')) return;
        const tnEl = fi.querySelector('.tn'); if (!tnEl) return;
        const name = tnEl.textContent.trim();
        const hasChildren = (dep.children && dep.children[name] && dep.children[name].length) || (dep.excl && dep.excl[name] && dep.excl[name].length);
        if (!hasChildren) return;

        tnEl.classList.add('dep-main');
        const caret = document.createElement('span');
        caret.className = 'dep-caret';
        caret.textContent = '▾';
        tnEl.appendChild(caret);

        const container = document.createElement('div');
        container.className = 'dep-children';
        container.style.display = 'none';

    function srt(arr) {
      return [...arr].sort((a, b) => {
        const va = sortKey === "category" ? a[1].c : a[0].toLowerCase();

        return sortAsc ? va < vb ? -1 : va > vb ? 1 : 0 : va > vb ? -1 : va < vb ? 1 : 0;
      });
    }

    function weaponSort(arr) {
      return [...arr].sort((a, b) => {
        // Primary sort
        let comparison = compareWeapons(a, b, weaponSortKey, weaponSortAsc);
        if (comparison !== 0) return comparison;
        
        // Secondary sort (if specified)
        if (weaponThenSortKey && weaponThenSortKey !== "none") {
          comparison = compareWeapons(a, b, weaponThenSortKey, weaponThenSortAsc);
          if (comparison !== 0) return comparison;
        }
        
        // Fallback to name sort
        const nameA = a[0].toLowerCase();
        const nameB = b[0].toLowerCase();
        return nameA < nameB ? -1 : nameA > nameB ? 1 : 0;
      });
    }

    function compareWeapons(a, b, key, asc) {
      const nameA = a[0];
      const nameB = b[0];
      const statsA = a[1].stats;
      const statsB = b[1].stats;
      
      if (key === "name") {
        const va = nameA.toLowerCase();
        const vb = nameB.toLowerCase();
        return asc ? va < vb ? -1 : va > vb ? 1 : 0 : va > vb ? -1 : va < vb ? 1 : 0;
      }
      
      if (key === "type") {
        const va = a[1].type || "";
        const vb = b[1].type || "";
        return asc ? va < vb ? -1 : va > vb ? 1 : 0 : va > vb ? -1 : va < vb ? 1 : 0;
      }
      
      if (key === "rarity") {
        const rarityOrder = { "": 0, "Common": 1, "Uncommon": 2, "Rare": 3, "Legendary": 4, "Mythic": 5 };
        const va = rarityOrder[a[1].sellRarity || ""] || 0;
        const vb = rarityOrder[b[1].sellRarity || ""] || 0;
        return asc ? va - vb : vb - va;
      }
      
      // For stats, get the value or default to 0
      const va = statsA[key] ?? 0;
      const vb = statsB[key] ?? 0;
      
      // Handle numeric comparison
      if (typeof va === "number" && typeof vb === "number") {
        return asc ? va - vb : vb - va;
      }
      
      // Fallback to string comparison
      const sa = String(va);
      const sb = String(vb);
      return asc ? sa < sb ? -1 : sa > sb ? 1 : 0 : sa > sb ? -1 : sa < sb ? 1 : 0;
    }

        const k = e.key.toLowerCase();
        if (k === sec[sp]) { sp++; if (sp === sec.length) { showEgg("and now the night is gone"); sp = 0; } }
        else { sp = k === sec[0] ? 1 : 0; }
      });
      document.getElementById("egcl").addEventListener("click", hideEgg);
      document.getElementById("egov").addEventListener("click", e => { if (e.target === document.getElementById("egov")) hideEgg(); });


      document.getElementById("tocul").addEventListener("click", function (e) {
        const lnk = e.target.closest(".toc-a"); if (!lnk) return;
        e.preventDefault();
        if (lnk.classList.contains("on")) { lnk.classList.remove("on"); document.getElementById("tocc").textContent = ""; return; }
        document.querySelectorAll(".toc-a").forEach(a => a.classList.remove("on"));
        lnk.classList.add("on");
        updToc(lnk.dataset.t, curCat || "information");
      });
    });
  </script>
</body>
